<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StorageLab — Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;560;700&family=Newsreader:opsz,wght@16..72,500;16..72,650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/gestao.css" />
  </head>
  <body>
    <header class="bar">
      <div>
        <p class="eyebrow">Laboratório</p>
        <h1>Gestão do estoque</h1>
      </div>
      <nav>
        <a href="/">Celular</a>
        <a class="atual" href="/gestao">Gestão</a>
      </nav>
    </header>

    <section class="toolbar">
      <input id="busca" type="search" placeholder="Buscar nome, empresa, solicitante, verba..." />
      <button class="btn btn-ghost" id="importar">Atualizar da planilha</button>
      <button class="btn btn-primary" id="novo">Cadastrar na mão</button>
    </section>

    <section class="resumo" id="resumo"></section>
    <p class="aviso" id="aviso" hidden></p>
    <div class="navegacao-tabela" aria-label="Navegação horizontal da tabela">
      <span>Arraste a barra ou use os botões para ver mais colunas.</span>
      <div>
        <button class="btn btn-ghost" id="colunas-esquerda" type="button">← Colunas</button>
        <button class="btn btn-ghost" id="colunas-direita" type="button">Colunas →</button>
      </div>
    </div>
    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th rowspan="2"><button class="ordenar" data-ordenar="solicitante" type="button">Solicitante</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="nome" type="button">Reagente / Material</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="codigo_fornecedor" type="button">Código fornecedor</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="quantidade" type="button">Quantidade</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="unidade" type="button">Unidade</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="empresa" type="button">Empresa</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="data" type="button">Data</button></th>
            <th colspan="2" class="grupo-coluna">Valor</th>
            <th rowspan="2"><button class="ordenar" data-ordenar="previsao" type="button">Previsão</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="verba" type="button">Verba</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="entregue" type="button">Entregue</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="data_entrega" type="button">Data entrega</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="local_sala" type="button">Local / sala</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="local_armazenamento" type="button">Armário / freezer / geladeira</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="codigo" type="button">Codigo</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="prateleira" type="button">Prateleira</button></th>
            <th rowspan="2"><button class="ordenar" data-ordenar="emprestado" type="button">Emprestado</button></th>
            <th rowspan="2">Acoes</th>
          </tr>
          <tr>
            <th><button class="ordenar" data-ordenar="valor_brl" type="button">R$</button></th>
            <th><button class="ordenar" data-ordenar="valor_usd" type="button">US$</button></th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>

    <dialog id="dialogo">
      <form id="formulario" method="dialog">
        <h2 id="titulo-form">Cadastrar na mão</h2>
        <label for="codigo">Codigo</label>
        <input id="codigo" required />
        <label for="solicitante">Solicitante</label>
        <input id="solicitante" />
        <label for="nome">Reagente / Material</label>
        <input id="nome" required />
        <label for="codigo-fornecedor">Código do fornecedor</label>
        <input id="codigo-fornecedor" />
        <label for="quantidade">Quantidade</label>
        <input id="quantidade" />
        <label for="unidade">Unidade</label>
        <input id="unidade" />
        <label for="marca">Empresa</label>
        <input id="marca" />
        <label for="data">Data</label>
        <input id="data" />
        <label for="valor-brl">Valor (R$)</label>
        <input id="valor-brl" inputmode="decimal" />
        <label for="valor-usd">Valor (US$)</label>
        <input id="valor-usd" inputmode="decimal" />
        <label for="previsao">Previsão</label>
        <input id="previsao" />
        <label for="verba">Verba</label>
        <input id="verba" />
        <label for="entregue">Entregue</label>
        <input id="entregue" />
        <label for="data-entrega">Data da entrega</label>
        <input id="data-entrega" />
        <label for="local-sala">Local / sala</label>
        <input id="local-sala" />
        <label for="local-armazenamento">Armário, freezer ou geladeira</label>
        <input id="local-armazenamento" />
        <label for="barras" id="rotulo-barras" hidden>Codigo de barras</label>
        <input id="barras" hidden />
        <p class="erro" id="erro-form" hidden></p>
        <div class="acoes-form">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <button type="button" class="btn btn-ghost" id="cancelar">Cancelar</button>
        </div>
      </form>
    </dialog>

    <script src="/js/api.js" type="module"></script>
    <script src="/js/gestao.js" type="module"></script>
  </body>
</html>
